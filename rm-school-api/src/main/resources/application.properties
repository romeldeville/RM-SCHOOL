spring.application.name=${APP_NAME:rm-school-api}

server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rm_school}
spring.datasource.username=${DB_USERNAME:rm_school_user}
spring.datasource.password=${DB_PASSWORD:rm_school_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}

# JWT
app.jwt.secret=${JWT_SECRET:changeMeChangeMeChangeMeChangeMeChangeMeChangeMe}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.header=${JWT_HEADER:Authorization}
app.jwt.prefix=${JWT_PREFIX:Bearer }

# OpenAPI / Swagger UI
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
springdoc.swagger-ui.operations-sorter=${SPRINGDOC_SWAGGER_UI_OPERATIONS_SORTER:method}
springdoc.swagger-ui.tags-sorter=${SPRINGDOC_SWAGGER_UI_TAGS_SORTER:alpha}
springdoc.default-produces-media-type=${SPRINGDOC_DEFAULT_PRODUCES_MEDIA_TYPE:application/json}
springdoc.default-consumes-media-type=${SPRINGDOC_DEFAULT_CONSUMES_MEDIA_TYPE:application/json}
